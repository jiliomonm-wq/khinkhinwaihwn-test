<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HADAKA Mobile Experience</title>
<style>
  :root{
    --bg:#f5f5f7; --text:#050505; --muted:#999; --accent:#ff2a44;
    --font-mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --font-sans:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    background:var(--bg); color:var(--text); font-family:var(--font-sans);
    width:100%; overflow-x:hidden; touch-action:pan-y; -webkit-font-smoothing:antialiased;
  }
  .scroll-container{position:relative; width:100vw; height:750vh}

  .mobile-stage{
    position:fixed; inset:0; overflow:hidden;
    perspective:1000px; z-index:1;
  }
  .header-ui{
    position:fixed; top:0; left:0; width:100vw;
    padding:1.25rem 1.5rem; display:flex; justify-content:space-between; align-items:baseline;
    font-family:var(--font-mono); font-size:.75rem; letter-spacing:.15em;
    z-index:50; mix-blend-mode:difference; color:#fff; pointer-events:none;
  }
  .footer-ui{
    position:fixed; bottom:0; left:0; width:100vw;
    padding:1.25rem 1.5rem; display:flex; justify-content:space-between;
    font-family:var(--font-mono); font-size:.7rem; letter-spacing:.12em;
    z-index:50; color:var(--muted); pointer-events:none;
  }

  /* CENTERED STACK */
  .hero-title, .flow-item{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    will-change:transform, opacity;
    pointer-events:none;
  }
  .hero-title{ text-align:center; width:90%; z-index:2; }
  .hero-title h1{
    font-size:3.5rem; font-weight:900;
    letter-spacing:-.04em; line-height:1.1; color:var(--text);
  }
  .hero-title span{
    display:block; font-family:var(--font-mono);
    font-size:.75rem; letter-spacing:.25em; color:var(--muted); margin-top:1rem;
  }

  .flow-item{
    width:82vw; max-width:360px;
    display:flex; flex-direction:column; align-items:flex-start;
    opacity:0;
  }
  .flow-item img{
    width:100%; height:auto; display:block; object-fit:cover;
    border-radius:2px;
    filter:contrast(102%) brightness(98%);
    box-shadow:0 15px 35px rgba(0,0,0,.06);
  }
  .caption-track{
    width:100%; margin-top:.6rem;
    display:flex; justify-content:space-between;
    font-family:var(--font-mono); font-size:.65rem;
    color:var(--text); letter-spacing:.1em; opacity:.85;
  }
  .caption-track .num{color:var(--accent); font-weight:bold}
</style>
</head>
<body>

<aside class="header-ui">
  <span>HADAKA / JP</span>
  <span id="scrollPct">000%</span>
</aside>

<footer class="footer-ui">
  <span>0 TO WONDER</span>
  <span>MOBILE ARCHIVE</span>
</footer>

<main class="mobile-stage">
  <div class="hero-title" id="heroElement">
    <h1>すべてを、<br>裸に。</h1>
    <span>SCROLL TO STRIP</span>
  </div>

  <div class="flow-item" data-offset-x="-5" data-rotate="-3">
    <img src="1.jpg" alt="" loading="eager">
    <div class="caption-track"><span class="num">01 / WORLD</span><span>CANOPY LIGHT</span></div>
  </div>

  <div class="flow-item" data-offset-x="5" data-rotate="2.5">
    <img src="2.jpg" alt="" loading="lazy">
    <div class="caption-track"><span class="num">02 / ART</span><span>RITUAL TAPE</span></div>
  </div>

  <div class="flow-item" data-offset-x="-6" data-rotate="-2">
    <img src="3.jpg" alt="" loading="lazy">
    <div class="caption-track"><span class="num">03 / VISION</span><span>NOTICING BEAUTY</span></div>
  </div>

  <div class="flow-item" data-offset-x="4" data-rotate="3">
    <img src="4.jpg" alt="" loading="lazy">
    <div class="caption-track"><span class="num">04 / COMMERCIAL</span><span>SARDOR FREEFALL</span></div>
  </div>

  <div class="flow-item" data-offset-x="-5" data-rotate="-2.5">
    <img src="5.jpg" alt="" loading="lazy">
    <div class="caption-track"><span class="num">05 / EXPRESSION</span><span>DESIGN MACHINE</span></div>
  </div>

  <div class="flow-item" data-offset-x="4" data-rotate="2">
    <img src="6.jpg" alt="" loading="lazy">
    <div class="caption-track"><span class="num">06 / IDENTITY</span><span>RAW PORTRAIT</span></div>
  </div>

  <div class="flow-item" data-offset-x="0" data-rotate="0">
    <img src="7.png" alt="" loading="lazy">
    <div class="caption-track"><span class="num">07 / NARRATIVE</span><span>DUO STUDY</span></div>
  </div>
</main>

<div class="scroll-container"></div>

<script>
(function(){
  const items    = Array.from(document.querySelectorAll('.flow-item'));
  const hero     = document.getElementById('heroElement');
  const pctLabel = document.getElementById('scrollPct');

  const total = items.length;
  const step  = 1 / total;
  const WINDOW = step * 1.8;   // ← 1.8x ဆိုတော့ item ၂ ခုလောက် တစ်ပြိုင်နက် မြင်ရမယ် (mix)

  // Pre-parse
  const cfg = items.map(el => ({
    el,
    offX: parseFloat(el.dataset.offsetX) || 0,
    rot:  parseFloat(el.dataset.rotate)  || 0
  }));

  const clamp  = (v,a,b)=>Math.min(Math.max(v,a),b);
  const easeOut = t=>1-Math.pow(1-t,3);

  let ticking = false;

  function update(){
    ticking = false;

    const scrollY = window.scrollY || window.pageYOffset;
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    const progress = clamp(scrollY / maxScroll, 0, 1);

    pctLabel.textContent = String(Math.round(progress*100)).padStart(3,'0') + '%';

    /* ── HERO: fade & zoom during first 12% ── */
    const heroExit = clamp(progress / 0.12, 0, 1);
    const heroScale = 1 + easeOut(heroExit) * 1.6;
    hero.style.transform = `translate(-50%,-50%) scale(${heroScale.toFixed(3)})`;
    hero.style.opacity   = Math.max(0, 1 - heroExit * 1.2).toFixed(3);

    /* ── ITEMS: travel upward + mix ── */
    for (let i = 0; i < total; i++){
      const c = cfg[i];
      const start = i * step;
      const end   = start + WINDOW;
      const el    = c.el;

      if (progress < start || progress > end){
        if (el.style.opacity !== '0'){
          el.style.opacity = '0';
          el.style.visibility = 'hidden';
        }
        continue;
      }

      const localP = clamp((progress - start) / (end - start), 0, 1);

      // ▲ VERTICAL TRAVEL: +75vh (below) → 0 → -75vh (above)
      const y = 75 - localP * 150;

      // ► Horizontal drift (converges slightly toward center)
      const x = c.offX * (1 - localP * 0.6);

      // ▲ SCALE: small at edges, biggest at center
      const distFromCenter = Math.abs(localP - 0.5) * 2;   // 1 → edge, 0 → center
      const scale = 0.55 + (1 - distFromCenter) * 0.65;    // 0.55 → 1.20

      // Rotation drift
      const rot = c.rot * (1 - localP);

      // Opacity curve
      let opacity;
      if (localP < 0.18)      opacity = easeOut(localP / 0.18);
      else if (localP > 0.78) opacity = easeOut((1 - localP) / 0.22);
      else                    opacity = 1;

      el.style.visibility = 'visible';
      el.style.opacity    = opacity.toFixed(3);
      el.style.transform  =
        `translate(-50%,-50%) ` +
        `translate3d(${x.toFixed(2)}vw, ${y.toFixed(2)}vh, 0) ` +
        `rotate(${rot.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
    }
  }

  function onScroll(){
    if (!ticking){
      ticking = true;
      requestAnimationFrame(update);
    }
  }

  window.addEventListener('scroll', onScroll, { passive:true });
  window.addEventListener('resize', onScroll);
  update(); // initial paint
})();
</script>
</body>
</html>
